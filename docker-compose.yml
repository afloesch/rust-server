name: rust

services:
  init-config:
    image: alpine:latest
    container_name: init-config
    command:
      - "/bin/sh"
      - "-c"
      - "mkdir -p /srv/rust/server/${SERVER_IDENTITY:-main}/cfg && cp /var/tmp/* /srv/rust/server/${SERVER_IDENTITY:-main}/cfg/"
    volumes:
      - server:/srv/rust/server
      - ./config:/var/tmp

  rust-server:
    image: rust-server-carbon
    container_name: rust-server
    depends_on:
      - init-config
    command:
      - "-batchmode"
      - "-nographics"
      - "+server.ip"
      - "0.0.0.0"
      - "+server.port"
      - "28015"
      - "+rcon.ip"
      - "0.0.0.0"
      - "+rcon.port"
      - "28016"
      - "+rcon.password"
      - "supersecret"
      - "+rcon.web"
      - "1"
      - "+server.identity"
      - "${SERVER_IDENTITY:-main}"
    ports:
      - "28015:28015/udp"
      - "28016:28016/tcp"
    volumes:
      - server:/srv/rust/server
      - carbon:/srv/rust/carbon

volumes:
  server:
  carbon:
